<!DOCTYPE html>
<html>
<head>
    <title>Register - Task Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="flex-center auth-container">
    <div class="card auth-card">

        <h2 class="mb-2">Register</h2>

        <div id="reg-error" class="alert alert-danger" style="display:none"></div>
        <div id="reg-success" class="alert alert-success" style="display:none"></div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="reg-username" placeholder="Choose a username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="reg-password" placeholder="Min 6 characters" required>
        </div>

        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="reg-confirm" placeholder="Repeat password" required>
        </div>

        <button class="btn btn-primary" onclick="doRegister()">Register</button>

        <p style="margin-top: 1rem; text-align: center;">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

    </div>
</div>

<script>
    function doRegister() {
        const username = document.getElementById('reg-username').value.trim();
        const password = document.getElementById('reg-password').value.trim();
        const confirm  = document.getElementById('reg-confirm').value.trim();
        const error    = document.getElementById('reg-error');
        const success  = document.getElementById('reg-success');

        error.style.display   = 'none';
        success.style.display = 'none';

        if (!username || !password) {
            error.textContent = "All fields are required.";
            error.style.display = 'block';
            return;
        }

        if (password !== confirm) {
            error.textContent = "Passwords do not match.";
            error.style.display = 'block';
            return;
        }

        if (password.length < 6) {
            error.textContent = "Password must be at least 6 characters.";
            error.style.display = 'block';
            return;
        }

        success.textContent = "Account created! Redirecting to login...";
        success.style.display = 'block';

        setTimeout(() => {
            window.location.href = 'login.html';
        }, 1500);
    }
</script>

</body>
</html>
