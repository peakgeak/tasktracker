<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Task Tracker</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<nav class="navbar">
    <div class="container flex-between">
        <div class="nav-brand">Task Tracker</div>
        <div class="nav-links">
            <span id="nav-welcome"></span>
            <a href="logout.html">Logout</a>
        </div>
    </div>
</nav>

<div class="container section">

    <h1 class="mb-2">Dashboard</h1>

    <div class="card mb-2">
        <h2>Add Task</h2>

        <div class="form-group">
            <label>Task Title</label>
            <input type="text" id="task-title" placeholder="Enter task title" required>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea id="task-desc" placeholder="Enter description (optional)"></textarea>
        </div>

        <button class="btn btn-primary" onclick="addTask()">Add Task</button>
    </div>

    <div class="card">
        <h2 class="mb-2">Your Tasks</h2>
        <table class="table">
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            <tbody id="task-list"></tbody>
        </table>
    </div>

</div>

<script>
    // ─── Guard: redirect if not logged in ─────────────────────────────────────
    const username = sessionStorage.getItem('username');
    if (!username) {
        window.location.href = 'login.html';
    }

    document.getElementById('nav-welcome').textContent = 'Welcome, ' + username;

    // ─── Fake demo tasks ───────────────────────────────────────────────────────
    let tasks = [
        { id: 1, title: "Design homepage layout",    description: "Create wireframes for the landing page", status: "Completed" },
        { id: 2, title: "Set up database schema",    description: "Define tables for users and tasks",      status: "Completed" },
        { id: 3, title: "Build login page",          description: "HTML form with validation",              status: "Pending"   },
        { id: 4, title: "Implement CRUD operations", description: "Add, edit, delete, and complete tasks",  status: "Pending"   },
        { id: 5, title: "Write documentation",       description: "README and inline code comments",        status: "Pending"   },
    ];

    let nextId = 6;

    // ─── ADD TASK ──────────────────────────────────────────────────────────────
    function addTask() {
        const title = document.getElementById('task-title').value.trim();
        const desc  = document.getElementById('task-desc').value.trim();

        if (!title) return;

        tasks.unshift({ id: nextId++, title: title, description: desc, status: "Pending" });

        document.getElementById('task-title').value = '';
        document.getElementById('task-desc').value  = '';

        renderTasks();
    }

    // ─── COMPLETE TASK ─────────────────────────────────────────────────────────
    function completeTask(id) {
        const task = tasks.find(t => t.id === id);
        if (task) task.status = "Completed";
        renderTasks();
    }

    // ─── DELETE TASK ───────────────────────────────────────────────────────────
    function deleteTask(id) {
        tasks = tasks.filter(t => t.id !== id);
        renderTasks();
    }

    // ─── RENDER TASKS ──────────────────────────────────────────────────────────
    function renderTasks() {
        const list = document.getElementById('task-list');

        if (!tasks.length) {
            list.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#888">No tasks yet. Add one above!</td></tr>';
            return;
        }

        list.innerHTML = tasks.map(task => `
            <tr>
                <td>${task.title}</td>
                <td>${task.description || '—'}</td>
                <td>${task.status}</td>
                <td>
                    ${task.status !== 'Completed'
                        ? `<a class="btn btn-success" onclick="completeTask(${task.id})">Complete</a>`
                        : ''}
                    <a class="btn btn-danger" onclick="deleteTask(${task.id})">Delete</a>
                </td>
            </tr>
        `).join('');
    }

    renderTasks();
</script>

</body>
</html>
