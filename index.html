<!DOCTYPE html>
<html>
<head>
    <title>Login - Task Tracker</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="flex-center auth-container">
    <div class="card auth-card">

        <h2 class="mb-2">Login</h2>

        <div id="login-error" class="alert alert-danger" style="display:none"></div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="login-username" placeholder="Any username" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="Any password" required>
        </div>

        <button class="btn btn-primary" onclick="doLogin()">Login</button>

        <p style="margin-top: 1rem; text-align: center;">
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

    </div>
</div>

<script>
    function doLogin() {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value.trim();
        const error    = document.getElementById('login-error');

        if (!username || !password) {
            error.textContent = "Please enter username and password.";
            error.style.display = 'block';
            return;
        }

        error.style.display = 'none';

        // Save username to sessionStorage and redirect to dashboard
        sessionStorage.setItem('username', username);
        window.location.href = 'dashboard.html';
    }
</script>

</body>
</html>
